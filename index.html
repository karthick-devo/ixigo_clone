<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix-clone</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header class="header-container">
        <div class="logo">
             <img src="assets/icons/Netflix-Logo.png" class="logo_img"/>
        </div>
        <div class="header-side-button">
            <select>
                <option value="languages">English</option>
                <option value="languages">हिन्दी</option>
            </select>
            <div class="signin" style="font-weight:600;">Sign in</div>
        </div>
    </header>
    <div class="main-con">
        <div class="back-drop-filter" ></div>
        <div class="inner-con">
            <div class="con1">
                <h2 class="content1">
                    <span>Unlimited movies, TV<br /> shows and more</span>
                </h2>
                <p class="content2">Starts at ₹149. Cancel at any time.</p>
            </div>
        </div>
        <div class="inner-con1">
            <h3 class="content3">Ready to watch? Enter your email to create or restart your membership.</h3>
            <div class="content4">
                <div class="mail">Email address</div>
                <div class="get-started">Get started ></div>
            </div>
        </div>
    </div>
    
    <div class="sec-con">
        <div class="inner-sec">
            <h class="trending-now">Trending Now</h>
        </div>
        <div class="inner-sec-con"></div>
        <div class="inner-sec-con"></div>
        <div class="inner-sec-con"></div>
        <div class="inner-sec-con"></div>
        <div class="inner-sec-con"></div>
        <div class="inner-sec-con"></div>
        <div class="inner-sec-con"></div>
    </div>

</body>

</html>
